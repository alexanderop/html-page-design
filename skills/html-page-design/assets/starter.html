<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page Name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: single reading column, 68ch, summary strip above the detail sections. */
:root {
  --bg: #f7f8f6;
  --surface: #ffffff;
  --fg: #1d2420;
  --muted: #5d6862;
  --line: #dde3df;
  --accent: #2f6b55;

  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --step--1: 0.875rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: 2.2rem;

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614;
    --surface: #1a201d;
    --fg: #e6ebe8;
    --muted: #9aa69f;
    --line: #2b3430;
    --accent: #7cc4a6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121614;
  --surface: #1a201d;
  --fg: #e6ebe8;
  --muted: #9aa69f;
  --line: #2b3430;
  --accent: #7cc4a6;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
  padding-block: max(32px, env(safe-area-inset-top, 0px)) max(48px, env(safe-area-inset-bottom, 0px));
  background: var(--bg);
  color: var(--fg);
  font: var(--step-0)/1.6 var(--font-body);
}
img, svg, video { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { max-width: 68ch; margin-inline: auto; display: grid; gap: 2.5rem; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: var(--step-3); }
h2 { font-size: var(--step-2); }
p { margin: 0; }
section { display: grid; gap: 1rem; min-width: 0; }

.eyebrow {
  font-size: var(--step--1);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.lede { font-size: var(--step-1); color: var(--muted); }
code, pre { font-family: var(--font-mono); font-size: 0.9em; }
pre { overflow-x: auto; padding: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main>
  <header style="display:grid;gap:.75rem">
    <p class="eyebrow">Category</p>
    <h1>Page Name</h1>
    <p class="lede">One sentence on what this page is for.</p>
  </header>

  <section>
    <h2>First section</h2>
    <p>Real content goes here.</p>
  </section>
</main>
</body>
</html>
